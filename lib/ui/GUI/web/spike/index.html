<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Banc WebView2</title>
<style>
  :root { --fond:#fff; --texte:#1b1b1b; --faible:#6b6b6b; --trait:#e2e2e2; }
  body.sombre { --fond:#2b2b2b; --texte:#eaeaea; --faible:#9a9a9a; --trait:#444; }
  body { margin:0; padding:14px; background:var(--fond); color:var(--texte);
         font:13px/1.5 "Segoe UI", system-ui, sans-serif; }
  h1 { font-size:14px; margin:0 0 10px; }
  table { border-collapse:collapse; width:100%; }
  td { padding:4px 6px; border-bottom:1px solid var(--trait); }
  td:first-child { color:var(--faible); width:11em; }
  .ok::before { content:"OK "; color:#2e7d32; font-weight:600; }
  .ko::before { content:"ECHEC "; color:#c62828; font-weight:600; }
  code { font-family:Consolas, monospace; }
</style>
</head>
<body>
<h1>Banc WebView2 — page locale</h1>
<table>
  <tr><td>origine</td><td><code id="origine">—</code></td></tr>
  <tr><td>modules ES</td><td id="modules">en cours…</td></tr>
  <tr><td>fetch</td><td id="fetch">en cours…</td></tr>
  <tr><td>thème reçu</td><td id="theme">—</td></tr>
  <tr><td>allers-retours</td><td id="tours">0</td></tr>
</table>

<script>
// Script CLASSIQUE, avant le module, et c'est délibéré : un `try` placé DANS
// le module ne peut pas attraper l'échec de son propre `import`. Sans ce
// filet, un module qui ne charge pas ne produit aucun `pret` — et l'hôte
// attendrait indéfiniment, ce qui se lirait « WebView2 ne marche pas ».
window.addEventListener('error', function (e) {
  try {
    window.chrome.webview.postMessage(JSON.stringify({
      type: 'erreur', message: String(e.message || e.type)
    }));
  } catch (_) { /* rien à faire : l'hôte verra l'absence de `pret` */ }
});
</script>

<script type="module">
// Le `type="module"` est lui-même une mesure : sous `file://` WebView2
// refuse les modules ES. S'il s'exécute, le mapping virtuel fait son office.
import { marque } from './module.js';

const $ = (id) => document.getElementById(id);
const etat = { modules: false, fetch: false };

$('origine').textContent = location.origin;
$('modules').textContent = marque();
$('modules').className = 'ok';
etat.modules = true;

let tours = 0;

// Le canal : `PostWebMessageAsJson` côté hôte arrive ici en objet déjà parsé
// (`event.data`), et on répond en CHAÎNE — l'hôte lit par
// `TryGetWebMessageAsString`, ce qui évite toute ambiguïté de forme.
function repondre(charge) {
  window.chrome.webview.postMessage(JSON.stringify(charge));
}

window.chrome.webview.addEventListener('message', (event) => {
  const message = typeof event.data === 'string'
    ? JSON.parse(event.data) : event.data;
  if (message.type === 'ping') {
    // Le DOM n'est PAS touché ici : une invalidation par aller-retour
    // fausserait le seul chiffre que le banc mesure. L'hôte compte, lui.
    tours += 1;
    repondre({ type: 'pong' });
  } else if (message.type === 'theme') {
    document.body.classList.toggle('sombre', message.valeur === 'sombre');
    $('theme').textContent = message.valeur;
    $('theme').className = 'ok';
  } else if (message.type === 'fond') {
    // Message posté depuis un fil de fond .NET. On RÉPOND, et c'est tout
    // l'intérêt : côté hôte, « l'appel n'a pas levé » ne prouve pas que le
    // message est passé. Seul cet écho le prouve, et c'est sur lui que se
    // décide le tampon du streaming.
    $('tours').textContent = tours + ' (campagne terminée)';
    repondre({ type: 'fond-recu' });
  }
});

// `fetch` contre l'origine virtuelle : la seconde chose que `file://` casse.
try {
  const reponse = await fetch('./data.json');
  const donnees = await reponse.json();
  $('fetch').textContent = donnees.message;
  $('fetch').className = 'ok';
  etat.fetch = true;
} catch (erreur) {
  $('fetch').textContent = String(erreur);
  $('fetch').className = 'ko';
}

repondre({ type: 'pret', modules: etat.modules, fetch: etat.fetch });
</script>
</body>
</html>
