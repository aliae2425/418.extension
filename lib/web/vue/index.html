<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>OpenArchi</title>
<!-- Le moteur tourne DANS cette page, et du texte produit par un modèle y est
     rendu en HTML. Donc : aucun script en ligne, aucun `eval`, aucune origine
     extérieure. `'self'` suffit — `vue/` et `harnais/` partagent la même.

     Pas de `'unsafe-inline'` ni de hash : le filet d'erreur a son propre
     fichier, ce qui évite un hash à recalculer à chaque édition. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'self';
               style-src 'self';
               img-src 'self' data:;
               connect-src 'self' https://api.openai.com;
               base-uri 'none';
               form-action 'none'">
<!-- Deux feuilles, et l'ordre compte : les jetons d'abord, la mise en forme
     ensuite. `tokens.css` ne contient QUE des variables reprises du thème
     418 — c'est là qu'on ira brancher un générateur depuis Colors.xaml. -->
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./chat.css">
<!-- Classique et non différé : il doit tourner AVANT le module, pour
     attraper l'échec de son `import`. Cf. l'en-tête du fichier. -->
<script src="./filet.js"></script>
</head>
<body>

<div id="fil">
  <!-- Pas une bulle : personne n'a parlé. C'est le volet qui se présente,
       et il n'a qu'une question à poser. -->
  <div class="accueil">
    <!-- lucide: bot-message-square — la MÊME géométrie que `IconChat` dans
         `lib/ui/GUI/resources/Icons.xaml`, d'où sort l'icône du ruban. Le
         volet et son bouton montrent donc le même dessin.

         ponytail: transcrite à la main. Le CSS ne lit pas du XAML, et le
         WebView2 ne sert que `lib/web/`. Si `IconChat` change, changer ici
         aussi — `tools/icones.ps1 -Verifier` ne couvre pas ce fichier.

         `currentColor` : une seule copie suit le thème, là où deux PNG
         demandaient une variante claire et une sombre. -->
    <svg class="logo" viewBox="0 0 24 24" width="44" height="44" fill="none"
         stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 6V2H8"/>
      <path d="M15 11v2"/>
      <path d="M2 12h2"/>
      <path d="M20 12h2"/>
      <path d="M9 11v2"/>
      <path d="M20 16a2 2 0 0 1-2 2H8.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 4 20.286V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/>
    </svg>
    <p>Qu'est-ce qu'on fait sur la maquette aujourd'hui&nbsp;?</p>
  </div>
</div>

<!-- Au-dessus de la saisie, pas dessous : la liste pousserait sinon le champ
     hors de l'écran à mesure qu'elle se remplit. -->
<div id="suggestions" hidden></div>

<div id="barre">
  <textarea id="saisie" rows="1" placeholder="Écrivez… ou / pour les commandes"
            autocomplete="off" spellcheck="false"></textarea>
  <button id="action">Envoyer</button>
</div>
<div id="pied"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
